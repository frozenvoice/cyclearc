name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Release guard tests
        run: ./tests/Release.Tests.ps1

      - name: Build
        run: dotnet build CycleArc.sln -c Release

      - name: Test
        run: dotnet test CycleArc.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Validate desktop resources
        run: dotnet run --project tests/CycleArc.UiSmoke/CycleArc.UiSmoke.csproj -c Release --no-build

      - name: Installer recovery tests
        run: ./tests/LocalInstall.Tests.ps1

      - name: Publish win-x64
        run: >
          dotnet publish src/CycleArc/CycleArc.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Assert single-file artifact
        run: |
          if (!(Test-Path publish/win-x64/CycleArc.exe)) { throw "CycleArc.exe missing" }
          if (@(Get-ChildItem publish/win-x64 -File -Recurse).Count -ne 1) { throw "Unexpected companion files" }

      - name: Validate published Claude statusLine receiver
        run: >
          dotnet run --project tests/CycleArc.UiSmoke/CycleArc.UiSmoke.csproj
          -c Release --no-build -- --claude-process publish/win-x64/CycleArc.exe

      - name: Package stable Windows release
        shell: pwsh
        run: |
          $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $match = [regex]::Match($props, '<Version>\s*([^<]+?)\s*</Version>')
          if (!$match.Success) { throw 'Directory.Build.props does not contain a Version' }
          $version = $match.Groups[1].Value.Trim()
          $notes = Join-Path $PWD "release-notes/$version.md"
          $arguments = @{ PublishedDir = 'publish/win-x64'; OutputDir = 'publish/velopack'; Version = $version }
          if (Test-Path -LiteralPath $notes -PathType Leaf) { $arguments.ReleaseNotesPath = $notes }
          & ./scripts/Package.ps1 @arguments

      - name: Validate packaged update behavior
        run: >
          dotnet run --project tests/CycleArc.UiSmoke/CycleArc.UiSmoke.csproj
          -c Release --no-build -- --update-package publish/velopack

      - name: Upload Windows installer assets
        uses: actions/upload-artifact@v6
        with:
          name: CycleArc-win-x64
          path: publish/velopack/*

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failed-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
